# Include at http scope, behind a trusted local TLS-terminating gateway.
# The gateway must replace client-supplied X-Forwarded-Proto, not append to it.
map $http_x_forwarded_proto $bokji_https {
    default 0;
    https 1;
}

server {
    listen 127.0.0.1:8080;
    server_name _;
    root /srv/bokji-compass/dist;
    index index.html;
    include /etc/nginx/snippets/bokji-security-headers.conf;
    client_max_body_size 256k;
    # Reject missing/ambiguous metadata before any static file or upstream request.
    # Perform HTTP navigation redirects at the external TLS gateway.
    if ($bokji_https = 0) { return 403; }

    location = /admin/exhibition {
        return 302 /admin/exhibition/;
    }
    location /admin/exhibition/ {
        proxy_pass http://127.0.0.1:5181/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bokji-security-headers.conf;
    }

    location /api/ {
        # Same-host backend example. Change for a separate backend host.
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Member Q&A has a 60-second model deadline plus process cleanup.
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bokji-security-headers.conf;
    }
    location = /app-config.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bokji-security-headers.conf;
        try_files $uri =404;
    }
    location = /downloads/bokji-compass.apk {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="bokji-compass.apk"';
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bokji-security-headers.conf;
        try_files $uri =404;
    }
    location /downloads/ {
        return 404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bokji-security-headers.conf;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bokji-security-headers.conf;
        etag off;
        if_modified_since off;
        try_files /index.html =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/bokji-security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/bokji-security-headers.conf;
        # The app uses hash routes. Unknown paths must not become HTML/CSS resources.
        try_files $uri =404;
    }
}
