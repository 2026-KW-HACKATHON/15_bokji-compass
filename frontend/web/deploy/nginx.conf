# Example behind a TLS-terminating gateway; adjust paths and upstream.
server {
    listen 8080;
    server_name _;
    root /srv/bokji-compass/dist;
    index index.html;

    location /api/ {
        # Same-host backend example. Change for a separate backend host.
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Member Q&A has a 60-second model deadline plus process cleanup.
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
    location = /app-config.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
